<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이진혁 | 게임 플레이 이력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #F2F4F8;
    --paper: #FFFFFF;
    --ink: #172033;
    --muted: #5B6478;
    --rule: #D5DAE3;
    --accent: #2C5BE8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 64px 24px 80px; }

  /* 헤더 */
  header { margin-bottom: 56px; }
  header .name { font-size: 15px; font-weight: 600; color: var(--muted); }
  header h1 {
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin: 6px 0 14px;
  }
  header p { color: var(--muted); font-size: 16px; max-width: 640px; word-break: keep-all; text-wrap: balance; }
  header p strong { color: var(--ink); font-weight: 700; }

  h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .section-desc { color: var(--muted); font-size: 14px; margin-bottom: 20px; word-break: keep-all; text-wrap: pretty; }
  section + section { margin-top: 64px; }

  /* 대표 게임 */
  .featured {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  .f-card {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-top: 4px solid var(--genre);
    border-radius: 6px;
    padding: 18px 16px 20px;
    display: flex;
    flex-direction: column;
  }
  .f-genre {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--genre); flex: none; }
  .f-title { font-size: 17px; font-weight: 700; margin: 6px 0 12px; line-height: 1.35; word-break: keep-all; text-wrap: balance; }
  .f-record { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .f-sub { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; min-height: 22px; }
  .chip {
    font-size: 11.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
    background: #EDF1FD; color: var(--accent);
  }
  .chip.plain { background: #F1F3F6; color: var(--muted); }
  .f-comment {
    font-size: 13.5px; color: #3A4356;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid #EDF0F4;
    word-break: keep-all;
    text-wrap: balance;
  }

  /* 장르 그리드 */
  .genres {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    align-items: start;
  }
  .g-box {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    overflow: hidden;
  }
  .g-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--rule);
    border-left: 4px solid var(--genre);
  }
  .g-name { font-size: 15px; font-weight: 700; }
  .g-meta { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .g-list { list-style: none; padding: 6px 0; }
  .g-list li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 7px 16px;
    font-size: 14px;
  }
  .g-list li + li { border-top: 1px solid #F1F3F6; }
  .g-game { flex: 1; word-break: keep-all; }
  .g-list li.is-featured .g-game { font-weight: 700; }
  .g-list li.is-featured .g-game::before {
    content: ""; display: inline-block; width: 6px; height: 6px;
    background: var(--accent); border-radius: 50%;
    margin-right: 7px; vertical-align: middle; position: relative; top: -1px;
  }
  .g-tier { font-size: 11.5px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .g-hours { font-size: 13.5px; color: var(--muted); white-space: nowrap; min-width: 64px; text-align: right; }

  footer {
    margin-top: 64px; padding-top: 24px;
    border-top: 1px solid var(--rule);
    font-size: 13.5px; color: var(--muted);
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
    word-break: keep-all;
  }
  footer span { text-wrap: balance; }
  footer a { color: var(--accent); font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  @media (max-width: 1080px) {
    .featured { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 860px) {
    .featured { grid-template-columns: repeat(2, 1fr); }
    .genres { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 40px 16px 56px; }
    .featured, .genres { grid-template-columns: 1fr; }
  }
  @media print {
    body { background: #fff; }
    .f-card, .g-box { break-inside: avoid; }
  }
</style>
</head>

      <article class="f-card" style="--genre:${genre.color}">
        <div class="f-genre"><span class="dot"></span>${esc(genre.name)}</div>
        <h3 class="f-title">${esc(g.name)}</h3>
        <div class="f-record">${esc(recordOf(g))}</div>
        <div class="f-sub">${chips}</div>
        <p class="f-comment">${esc(g.featured)}</p>
      </article>`;
  }).join('');

  // 장르별 박스 (게임 수가 많은 장르부터, 각 장르 안은 플레이타임 순)
  const sortKey = g => g.hours != null ? g.hours : (g.record ? 100000 : -1); // 기간 표기 게임은 맨 위로, 기록 없는 게임은 맨 아래로
  const boxes = GENRES
    .map(genre => {
      const list = GAMES.filter(g => g.genre === genre.id).sort((a, b) => sortKey(b) - sortKey(a));
      const sum = list.reduce((s, g) => s + (g.hours || 0), 0);
      return { genre, list, sum };
    })
    .sort((a, b) => b.list.length - a.list.length);

  document.getElementById('genres').innerHTML = boxes.map(({ genre, list, sum }) => `
    <div class="g-box" style="--genre:${genre.color}">
      <div class="g-head">
        <span class="dot"></span>
        <span class="g-name">${esc(genre.name)}</span>
        <span class="g-meta">${list.length}개${sum ? ` / ${fmtHours(Math.round(sum * 10) / 10)}` : ''}</span>
      </div>
      <ul class="g-list">
        ${list.map(g => `
          <li class="${g.featured ? 'is-featured' : ''}">
            <span class="g-game">${esc(g.name)}</span>
            ${g.tier ? `<span class="g-tier">${esc(g.tier)}</span>` : ''}
            <span class="g-hours">${esc(recordOf(g))}</span>
          </li>`).join('')}
      </ul>
    </div>`).join('');
</script>
</body>
</html>
